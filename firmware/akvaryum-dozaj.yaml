# =====================================================================
#  AquascapeTR - Otomatik Gubre Dozaj Sistemi  v1.0.0
#  Kart: LC Technology ESP-01 4 Kanal 12V Wi-Fi Role Modulu
#  https://github.com/AquascapeTR/akvaryum-dozaj
#  https://www.youtube.com/@AquascapeTR
#
#  - Home Assistant GEREKMEZ. Kontrol kartin kendi web sayfasindan:
#      http://akvaryum-dozaj.local
#  - Ilk aciliste kart "Dozaj Kurulum" adli Wi-Fi agi yayinlar.
#    Telefonla baglanip (sifre: dozaj1234) kendi Wi-Fi aginizi secin.
#  - Ayarlar kartin hafizasinda saklanir, elektrik kesilince kaybolmaz.
#
#  Guvenlik:
#   - Role kartinin kendi islemcisi roleyi acik tutar; bu yuzden her
#     "kapat" komutu 3 kez gonderilir.
#   - Hicbir pompa calismiyorken 15 sn'de bir "hepsi kapali" gonderilir.
#   - Acilista tum roleler kapatilir.
#   - Tek doz en fazla 'Maks. Pompa Suresi' kadar surer.
#   - Pompalar asla ayni anda calismaz; sirayla ve 10 sn arayla.
# =====================================================================

esphome:
  name: akvaryum-dozaj
  friendly_name: Akvaryum Dozaj
  project:
    name: aquascapetr.akvaryum-dozaj
    version: "1.0.0"
  on_boot:
    priority: -100
    then:
      - script.execute: tum_kapat
      - delay: 1s
      - script.execute: tum_kapat

esp8266:
  board: esp01_1m
  restore_from_flash: true

preferences:
  flash_write_interval: 5min

# Seri port role kartina ayrildigi icin seri log kapali
logger:
  baud_rate: 0

web_server:
  port: 80
  version: 3

ota:
  - platform: esphome
  - platform: web_server

# Wi-Fi bilgisi yazilimda YOK: kurulum telefondan, kurulum agi uzerinden yapilir
wifi:
  ap:
    ssid: "Dozaj Kurulum"
    password: "dozaj1234"
  # Kartin islemcisi calismaya baslamak icin bu mesajlari bekliyor
  on_connect:
    - uart.write: "WIFI CONNECTED\r\nWIFI GOT IP\r\n"
    - script.execute: tum_kapat

captive_portal:

uart:
  id: uart_bus
  tx_pin: GPIO1
  rx_pin: GPIO3
  baud_rate: 115200

time:
  - platform: sntp
    id: zaman
    timezone: Europe/Istanbul

globals:
  - id: aktif_kanal
    type: int
    initial_value: '0'

# ---------------------------------------------------------------------
#  Scriptler
# ---------------------------------------------------------------------
script:
  - id: tum_kapat
    mode: restart
    then:
      - lambda: |-
                { const uint8_t _c[4] = {0xA0, 0x01, 0x00, 0xA1}; id(uart_bus).write_array(_c, 4); }
                { const uint8_t _c[4] = {0xA0, 0x02, 0x00, 0xA2}; id(uart_bus).write_array(_c, 4); }
                { const uint8_t _c[4] = {0xA0, 0x03, 0x00, 0xA3}; id(uart_bus).write_array(_c, 4); }
                { const uint8_t _c[4] = {0xA0, 0x04, 0x00, 0xA4}; id(uart_bus).write_array(_c, 4); }
      - delay: 100ms
      - lambda: |-
                { const uint8_t _c[4] = {0xA0, 0x01, 0x00, 0xA1}; id(uart_bus).write_array(_c, 4); }
                { const uint8_t _c[4] = {0xA0, 0x02, 0x00, 0xA2}; id(uart_bus).write_array(_c, 4); }
                { const uint8_t _c[4] = {0xA0, 0x03, 0x00, 0xA3}; id(uart_bus).write_array(_c, 4); }
                { const uint8_t _c[4] = {0xA0, 0x04, 0x00, 0xA4}; id(uart_bus).write_array(_c, 4); }
      - delay: 100ms
      - lambda: |-
                { const uint8_t _c[4] = {0xA0, 0x01, 0x00, 0xA1}; id(uart_bus).write_array(_c, 4); }
                { const uint8_t _c[4] = {0xA0, 0x02, 0x00, 0xA2}; id(uart_bus).write_array(_c, 4); }
                { const uint8_t _c[4] = {0xA0, 0x03, 0x00, 0xA3}; id(uart_bus).write_array(_c, 4); }
                { const uint8_t _c[4] = {0xA0, 0x04, 0x00, 0xA4}; id(uart_bus).write_array(_c, 4); }
      - lambda: 'id(aktif_kanal) = 0;'

  # Doz verme: sirayla calisir (queued), aralarinda 10 sn bekler
  - id: doz
    mode: queued
    max_runs: 8
    parameters:
      kanal: int
      ml: float
    then:
      - if:
          condition:
            lambda: 'return kanal >= 1 && kanal <= 4 && ml >= 0.1f && !id(kalibrasyon).is_running();'
          then:
            - lambda: |-
                id(aktif_kanal) = kanal;
                { const uint8_t _c[4] = {0xA0, (uint8_t) kanal, 0x01, (uint8_t) (0xA1 + kanal)}; id(uart_bus).write_array(_c, 4); }
                ESP_LOGI("doz", "Kanal %d: %.1f ml basiliyor", kanal, ml);
            - delay: !lambda |-
                float hiz = 2.0f;
                switch (kanal) {
                  case 1: hiz = id(akis_1).state; break;
                  case 2: hiz = id(akis_2).state; break;
                  case 3: hiz = id(akis_3).state; break;
                  case 4: hiz = id(akis_4).state; break;
                }
                if (isnan(hiz) || hiz < 0.1f) hiz = 0.1f;
                float sn = ml / hiz;
                float maks = id(maks_sure).state;
                if (isnan(maks) || maks < 1.0f) maks = 30.0f;
                if (sn > maks) {
                  ESP_LOGW("doz", "Sure %.1f sn, sinir %.0f sn'ye kirpildi", sn, maks);
                  sn = maks;
                }
                return (uint32_t) (sn * 1000.0f);
            - script.execute: tum_kapat
            - script.wait: tum_kapat
            - lambda: |-
                template_::TemplateNumber *sise = nullptr;
                switch (kanal) {
                  case 1: sise = id(sise_1); break;
                  case 2: sise = id(sise_2); break;
                  case 3: sise = id(sise_3); break;
                  case 4: sise = id(sise_4); break;
                }
                if (sise != nullptr) {
                  float kalan = sise->state - ml;
                  if (kalan < 0) kalan = 0;
                  auto call = sise->make_call();
                  call.set_value(kalan);
                  call.perform();
                }
                ESP_LOGI("doz", "Kanal %d tamamlandi", kanal);
            - delay: 10s

  # Kalibrasyon: secilen pompayi 30 sn calistirir.
  # Bardakta biriken ml / 30 = Akis (ml/sn)
  - id: kalibrasyon
    mode: single
    parameters:
      kanal: int
    then:
      - if:
          condition:
            lambda: 'return kanal >= 1 && kanal <= 4 && !id(doz).is_running();'
          then:
            - lambda: |-
                id(aktif_kanal) = kanal;
                { const uint8_t _c[4] = {0xA0, (uint8_t) kanal, 0x01, (uint8_t) (0xA1 + kanal)}; id(uart_bus).write_array(_c, 4); }
                ESP_LOGI("kal", "Kanal %d kalibrasyon: 30 sn", kanal);
            - delay: 30s
            - script.execute: tum_kapat

# Bekci: hicbir is yokken roleleri periyodik olarak kapali tut
interval:
  - interval: 15s
    then:
      - if:
          condition:
            lambda: 'return !id(doz).is_running() && !id(kalibrasyon).is_running() && !id(tum_kapat).is_running();'
          then:
            - lambda: |-
                { const uint8_t _c[4] = {0xA0, 0x01, 0x00, 0xA1}; id(uart_bus).write_array(_c, 4); }
                { const uint8_t _c[4] = {0xA0, 0x02, 0x00, 0xA2}; id(uart_bus).write_array(_c, 4); }
                { const uint8_t _c[4] = {0xA0, 0x03, 0x00, 0xA3}; id(uart_bus).write_array(_c, 4); }
                { const uint8_t _c[4] = {0xA0, 0x04, 0x00, 0xA4}; id(uart_bus).write_array(_c, 4); }

# ---------------------------------------------------------------------
#  Genel ayarlar ve durum
# ---------------------------------------------------------------------
sensor:
  - platform: wifi_signal
    name: "Wi-Fi Sinyal"
    update_interval: 120s
  - platform: uptime
    name: "Çalışma Süresi"
    update_interval: 300s

text_sensor:
  - platform: template
    name: "Aktif Pompa"
    update_interval: 2s
    lambda: |-
      switch (id(aktif_kanal)) {
        case 1: return std::string("Pompa 1");
        case 2: return std::string("Pompa 2");
        case 3: return std::string("Pompa 3");
        case 4: return std::string("Pompa 4");
        default: return std::string("Beklemede");
      }

number:
  - platform: template
    id: maks_sure
    name: "Maks. Pompa Süresi"
    icon: mdi:timer-alert
    unit_of_measurement: s
    min_value: 1
    max_value: 60
    step: 1
    initial_value: 30
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config

  # --- Pompa 1 ---
