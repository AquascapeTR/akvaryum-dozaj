datetime:
  - platform: template
    id: saat_1
    type: time
    name: "Pompa 1 Doz Saati"
    optimistic: true
    restore_value: true
    initial_value: "10:00:00"
    time_id: zaman
    on_time:
      - if:
          condition:
            switch.is_on: oto_1
          then:
            - script.execute:
                id: doz
                kanal: 1
                ml: !lambda 'return id(ml_1).state;'
  - platform: template
    id: saat_2
    type: time
    name: "Pompa 2 Doz Saati"
    optimistic: true
    restore_value: true
