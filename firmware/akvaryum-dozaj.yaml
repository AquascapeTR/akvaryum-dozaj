# =====================================================================
#  AquascapeTR - Otomatik Gubre Dozaj Sistemi  v2.0.0
#  Donanim: ESP32 (veya ESP32-S3) gelistirme karti + 4 kanal role modulu
#  Pompa 1: GPIO18 | Pompa 2: GPIO17 | Pompa 3: GPIO16 | Pompa 4: GPIO4
#  Role modulu: VCC -> 3V3, JD-VCC -> 5V (jumper cikarilir), GND -> GND
#  https://github.com/AquascapeTR/akvaryum-dozaj
#  https://www.youtube.com/@AquascapeTR
#
#  - Home Assistant GEREKMEZ. Kontrol kartin kendi web sayfasindan:
#      http://aquascapetr.local
#  - Wi-Fi: kurulum sayfasinda yuklemeden hemen sonra ya da
#    "AquascapeTR Kurulum" agi uzerinden telefondan ayarlanir.
#    (sifre: dozaj1234)
#  - Ayarlar kartin hafizasinda saklanir, elektrik kesilince kaybolmaz.
#
#  Guvenlik:
#   - Pompa kapatma komutu 3 kez tekrarlanir.
#   - Hicbir pompa calismiyorken 15 sn'de bir "hepsi kapali" gonderilir.
#   - Acilista tum roleler kapatilir.
#   - Tek doz en fazla 'Maks. Pompa Suresi' kadar surer.
#   - Pompalar asla ayni anda calismaz; sirayla ve 10 sn arayla.
# =====================================================================

esphome:
  name: aquascapetr
  friendly_name: AquascapeTR Dozaj
  project:
    name: aquascapetr.akvaryum-dozaj
    version: "2.0.0"
  on_boot:
    priority: -100
    then:
      - script.execute: tum_kapat
      - delay: 1s
      - script.execute: tum_kapat

substitutions:
  board: esp32dev
  variant: esp32

esp32:
  board: ${board}
  variant: ${variant}

preferences:
  flash_write_interval: 5min

logger:

# AquascapeTR arayuzu (web/aquascapetr.js) kartin icine gomulur, internet gerekmez
web_server:
  port: 80
  version: 3
  # Sadece AquascapeTR arayuzu yuklenir; ESPHome'un varsayilan arayuzu ve
  # internetten dosya cekilmez (local: false + bos url'ler)
  local: false
  js_url: ""
  css_url: ""
  js_include: web/aquascapetr.js
  log: false

# Kurulum sayfasindan (USB uzerinden) Wi-Fi ayari
improv_serial:

ota:
  - platform: esphome
  - platform: web_server

# Wi-Fi bilgisi yazilimda YOK: kurulum telefondan, kurulum agi uzerinden yapilir
wifi:
  ap:
    ssid: "AquascapeTR Kurulum"
    password: "dozaj1234"
  on_connect:
    - script.execute: tum_kapat

captive_portal:

# Role modulu dusuk seviyede tetiklenir (LOW = acik), bu yuzden inverted
output:
  - platform: gpio
    id: pompa_1
    pin: {number: GPIO18, inverted: true}
  - platform: gpio
    id: pompa_2
    pin: {number: GPIO17, inverted: true}
  - platform: gpio
    id: pompa_3
    pin: {number: GPIO16, inverted: true}
  - platform: gpio
    id: pompa_4
    pin: {number: GPIO4, inverted: true}

time:
  - platform: sntp
    id: zaman
    timezone: Europe/Istanbul
    # Haftalik program: her dakika basinda her pompanin plani kontrol edilir.
    # Plan bicimi (Pompa N Program): "1111100 10:00=2.0,18:30=1.5"
    #   ilk 7 karakter: Pzt..Paz (1 = o gun doz var), sonra "SS:DD=ml" listesi
    on_time:
      - seconds: 0
        then:
          - lambda: |-
              auto now = id(zaman).now();
              if (!now.is_valid()) return;
              const int gun = (now.day_of_week + 5) % 7;  // 0 = Pazartesi
              const int dk = now.hour * 60 + now.minute;
              auto kontrol = [&](int kanal, bool oto, const std::string &plan) {
                if (!oto || plan.size() < 7 || plan[gun] != '1') return;
                size_t p = 7;
                while (p < plan.size()) {
                  while (p < plan.size() && (plan[p] == ' ' || plan[p] == ',')) p++;
                  if (p >= plan.size()) break;
                  int h = -1, m = -1; float ml = 0;
                  if (sscanf(plan.c_str() + p, "%d:%d=%f", &h, &m, &ml) == 3 &&
                      h * 60 + m == dk && ml >= 0.1f) {
                    ESP_LOGI("plan", "Kanal %d: planli doz %.1f ml", kanal, ml);
                    id(doz)->execute(kanal, ml);
                  }
                  size_t c = plan.find(',', p);
                  if (c == std::string::npos) break;
                  p = c + 1;
                }
              };
              kontrol(1, id(oto_1).state, id(plan_1).state);
              kontrol(2, id(oto_2).state, id(plan_2).state);
              kontrol(3, id(oto_3).state, id(plan_3).state);
              kontrol(4, id(oto_4).state, id(plan_4).state);

globals:
  - id: aktif_kanal
    type: int
    initial_value: '0'

# ---------------------------------------------------------------------
#  Scriptler
# ---------------------------------------------------------------------
script:
  - id: tum_kapat
    mode: restart
    then:
      - lambda: |-
                id(pompa_1).turn_off();
                id(pompa_2).turn_off();
                id(pompa_3).turn_off();
                id(pompa_4).turn_off();
      - delay: 100ms
      - lambda: |-
                id(pompa_1).turn_off();
                id(pompa_2).turn_off();
                id(pompa_3).turn_off();
                id(pompa_4).turn_off();
      - delay: 100ms
      - lambda: |-
                id(pompa_1).turn_off();
                id(pompa_2).turn_off();
                id(pompa_3).turn_off();
                id(pompa_4).turn_off();
      - lambda: 'id(aktif_kanal) = 0;'

  # Doz verme: sirayla calisir (queued), aralarinda 10 sn bekler
  - id: doz
    mode: queued
    max_runs: 24
    parameters:
      kanal: int
      ml: float
    then:
      - if:
          condition:
            lambda: 'return kanal >= 1 && kanal <= 4 && ml >= 0.1f && !id(kalibrasyon).is_running();'
          then:
            - lambda: |-
                id(aktif_kanal) = kanal;
                switch (kanal) {
                  case 1: id(pompa_1).turn_on(); break;
                  case 2: id(pompa_2).turn_on(); break;
                  case 3: id(pompa_3).turn_on(); break;
                  case 4: id(pompa_4).turn_on(); break;
                }
                ESP_LOGI("doz", "Kanal %d: %.1f ml basiliyor", kanal, ml);
            - delay: !lambda |-
                float hiz = 2.0f;
                switch (kanal) {
                  case 1: hiz = id(akis_1).state; break;
                  case 2: hiz = id(akis_2).state; break;
                  case 3: hiz = id(akis_3).state; break;
                  case 4: hiz = id(akis_4).state; break;
                }
                if (isnan(hiz) || hiz < 0.1f) hiz = 0.1f;
                float sn = ml / hiz;
                float maks = id(maks_sure).state;
                if (isnan(maks) || maks < 1.0f) maks = 30.0f;
                if (sn > maks) {
                  ESP_LOGW("doz", "Sure %.1f sn, sinir %.0f sn'ye kirpildi", sn, maks);
                  sn = maks;
                }
                return (uint32_t) (sn * 1000.0f);
            - script.execute: tum_kapat
            - script.wait: tum_kapat
            - lambda: |-
                template_::TemplateNumber *sise = nullptr;
                switch (kanal) {
                  case 1: sise = id(sise_1); break;
                  case 2: sise = id(sise_2); break;
                  case 3: sise = id(sise_3); break;
                  case 4: sise = id(sise_4); break;
                }
                if (sise != nullptr) {
                  float kalan = sise->state - ml;
                  if (kalan < 0) kalan = 0;
                  auto call = sise->make_call();
                  call.set_value(kalan);
                  call.perform();
                }
                ESP_LOGI("doz", "Kanal %d tamamlandi", kanal);
            - delay: 10s

  # Kalibrasyon: secilen pompayi 30 sn calistirir.
  # Bardakta biriken ml / 30 = Akis (ml/sn)
  - id: kalibrasyon
    mode: single
    parameters:
      kanal: int
    then:
      - if:
          condition:
            lambda: 'return kanal >= 1 && kanal <= 4 && !id(doz).is_running();'
          then:
            - lambda: |-
                id(aktif_kanal) = kanal;
                switch (kanal) {
                  case 1: id(pompa_1).turn_on(); break;
                  case 2: id(pompa_2).turn_on(); break;
                  case 3: id(pompa_3).turn_on(); break;
                  case 4: id(pompa_4).turn_on(); break;
                }
                ESP_LOGI("kal", "Kanal %d kalibrasyon: 30 sn", kanal);
            - delay: 30s
            - script.execute: tum_kapat

# Bekci: hicbir is yokken roleleri periyodik olarak kapali tut
interval:
  - interval: 15s
    then:
      - if:
          condition:
            lambda: 'return !id(doz).is_running() && !id(kalibrasyon).is_running() && !id(tum_kapat).is_running();'
          then:
            - lambda: |-
                id(pompa_1).turn_off();
                id(pompa_2).turn_off();
                id(pompa_3).turn_off();
                id(pompa_4).turn_off();

