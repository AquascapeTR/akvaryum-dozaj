    id: ml_1
    name: "Pompa 1 Doz"
    icon: mdi:beaker
    unit_of_measurement: ml
    min_value: 0
    max_value: 50
    step: 0.1
    initial_value: 0.0
    optimistic: true
    restore_value: true
    mode: box
  - platform: template
    id: akis_1
    name: "Pompa 1 Akış"
    icon: mdi:speedometer
    unit_of_measurement: ml/s
    min_value: 0.1
    max_value: 10
    step: 0.01
    initial_value: 2.0
    optimistic: true
    restore_value: true
    mode: box
    entity_category: config
  - platform: template
    id: sise_1
    name: "Pompa 1 Şişe Kalan"
    icon: mdi:bottle-tonic-outline
    unit_of_measurement: ml
    min_value: 0
