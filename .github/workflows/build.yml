name: Yazılımı derle ve kurulum sayfasını yayınla

on:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - "docs/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Sürüm notunu oku
        id: notlar
        run: echo "ozet=$(head -n1 firmware/YENILIKLER.txt)" >> "$GITHUB_OUTPUT"

      - name: ESPHome ile derle (ESP32)
        id: esp32
        uses: esphome/build-action@v7.0.0
        with:
          yaml-file: firmware/akvaryum-dozaj.yaml
          complete-manifest: true
          release-summary: ${{ steps.notlar.outputs.ozet }}
          release-url: https://github.com/AquascapeTR/akvaryum-dozaj/commits/main

      - name: ESPHome ile derle (ESP32-S3)
        id: esp32s3
        uses: esphome/build-action@v7.0.0
        with:
          yaml-file: firmware/akvaryum-dozaj-s3.yaml
          complete-manifest: true
          release-summary: ${{ steps.notlar.outputs.ozet }}
          release-url: https://github.com/AquascapeTR/akvaryum-dozaj/commits/main

      - name: Kurulum sayfasını hazırla
        run: |
          set -e
          mkdir -p site/firmware
          cp -r docs/* site/
          for d in "${{ steps.esp32.outputs.name }}" "${{ steps.esp32s3.outputs.name }}"; do
            ls -la "$d"
            cp "$d"/*.bin site/firmware/
          done
          # Iki kartin manifestini tek dosyada birlestir (sayfa karti otomatik tanir)
          jq -s '.[0] + {builds: (.[0].builds + .[1].builds)}' \
            "${{ steps.esp32.outputs.name }}/manifest.json" \
            "${{ steps.esp32s3.outputs.name }}/manifest.json" > site/firmware/manifest.json
          cat site/firmware/manifest.json
          ls -la site/firmware

      - name: Sayfa paketini yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages'e yayınla
        id: deployment
        uses: actions/deploy-pages@v4
