name: Yazılımı derle ve kurulum sayfasını yayınla

on:
  push:
    branches: [main]
    paths:
      - "firmware/**"
      - "docs/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: ESPHome ile derle
        id: esphome
        uses: esphome/build-action@v7.0.0
        with:
          yaml-file: firmware/akvaryum-dozaj.yaml
          complete-manifest: true

      - name: Kurulum sayfasını hazırla
        run: |
          mkdir -p site/firmware
          cp -r docs/* site/
          cp "${{ steps.esphome.outputs.name }}"/* site/firmware/
          rm -f site/firmware/*.elf
          # Sabit isimli kopyalar (manuel indirme linkleri için)
          cp site/firmware/*.factory.bin site/firmware/akvaryum-dozaj.factory.bin 2>/dev/null || true
          cp site/firmware/*.ota.bin site/firmware/akvaryum-dozaj.ota.bin 2>/dev/null || true
          ls -la site/firmware

      - name: Sayfa paketini yükle
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages'e yayınla
        id: deployment
        uses: actions/deploy-pages@v4
